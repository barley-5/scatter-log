<script>

/* =========================================================
   IndexedDB
========================================================= */

const DB_NAME =
    "scatter-log-db";

const STORE_NAME =
    "expenses";

let db;


/* =========================================================
   DOM
========================================================= */

const $ =
    id =>
        document.getElementById(id);


/* =========================================================
   DBを開く
========================================================= */

function openDatabase() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    DB_NAME,
                    1
                );


            request.onupgradeneeded =
                () => {

                    const database =
                        request.result;


                    if (
                        !database
                            .objectStoreNames
                            .contains(STORE_NAME)
                    ) {

                        database
                            .createObjectStore(
                                STORE_NAME,
                                {
                                    keyPath:
                                        "id",
                                    autoIncrement:
                                        true
                                }
                            );

                    }

                };


            request.onsuccess =
                () => {

                    db =
                        request.result;

                    resolve();

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =========================================================
   全件取得
========================================================= */

function getAllExpenses() {

    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );


            const request =
                transaction
                    .objectStore(
                        STORE_NAME
                    )
                    .getAll();


            request.onsuccess =
                () =>
                    resolve(
                        request.result
                    );


            request.onerror =
                () =>
                    reject(
                        request.error
                    );

        }
    );

}


/* =========================================================
   追加
========================================================= */

function addExpense(expense) {

    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            transaction
                .objectStore(
                    STORE_NAME
                )
                .add(expense);


            transaction.oncomplete =
                () =>
                    resolve();


            transaction.onerror =
                () =>
                    reject(
                        transaction.error
                    );

        }
    );

}


/* =========================================================
   更新
========================================================= */

function updateExpense(expense) {

    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            transaction
                .objectStore(
                    STORE_NAME
                )
                .put(expense);


            transaction.oncomplete =
                () =>
                    resolve();


            transaction.onerror =
                () =>
                    reject(
                        transaction.error
                    );

        }
    );

}


/* =========================================================
   削除
========================================================= */

function deleteExpense(id) {

    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readwrite"
                );


            transaction
                .objectStore(
                    STORE_NAME
                )
                .delete(id);


            transaction.oncomplete =
                () =>
                    resolve();


            transaction.onerror =
                () =>
                    reject(
                        transaction.error
                    );

        }
    );

}


/* =========================================================
   日付キー
========================================================= */

function dateKey(date) {

    const d =
        new Date(date);


    return (

        d.getFullYear()
        + "-"
        + String(
            d.getMonth() + 1
        ).padStart(
            2,
            "0"
        )
        + "-"
        + String(
            d.getDate()
        ).padStart(
            2,
            "0"
        )

    );

}


/* =========================================================
   月キー
========================================================= */

function monthKey(date) {

    const d =
        new Date(date);


    return (

        d.getFullYear()
        + "-"
        + String(
            d.getMonth() + 1
        ).padStart(
            2,
            "0"
        )

    );

}


/* =========================================================
   円表示
========================================================= */

function yen(amount) {

    return (
        "¥"
        +
        Number(
            amount
        ).toLocaleString(
            "ja-JP"
        )
    );

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   メッセージ
========================================================= */

function showMessage(text) {

    $("message")
        .textContent =
        text;


    clearTimeout(
        showMessage.timer
    );


    showMessage.timer =
        setTimeout(
            () => {

                $("message")
                    .textContent =
                    "";

            },
            1800
        );

}


/* =========================================================
   記録HTML
========================================================= */

function recordHTML(expense) {

    let category =
        escapeHTML(
            expense.category
        );


    if (
        expense.subcategory
    ) {

        category +=
            `
            <span
                class="record-subcategory">

                ${escapeHTML(
                    expense.subcategory
                )}

            </span>
            `;

    }


    const memo =
        expense.memo
            ? "・"
              +
              escapeHTML(
                  expense.memo
              )
            : "";


    return `

        <div
            class="record"
            data-id="${expense.id}">

            <div>

                <div
                    class="record-category">

                    ${category}

                </div>


                <div
                    class="record-meta">

                    ${expense.date}
                    ${memo}

                </div>

            </div>


            <div
                class="record-amount">

                ${yen(
                    expense.amount
                )}

            </div>

        </div>

    `;

}


/* =========================================================
   画面更新
========================================================= */

async function refresh() {

    const expenses =
        await getAllExpenses();


    expenses.sort(
        (a, b) =>
            new Date(b.createdAt)
            -
            new Date(a.createdAt)
    );


    const now =
        new Date();


    const today =
        dateKey(now);


    const month =
        monthKey(now);


    const todayTotal =
        expenses

            .filter(
                x =>
                    x.date ===
                    today
            )

            .reduce(
                (sum, x) =>
                    sum + x.amount,
                0
            );


    const monthTotal =
        expenses

            .filter(
                x =>
                    x.date.startsWith(
                        month
                    )
            )

            .reduce(
                (sum, x) =>
                    sum + x.amount,
                0
            );

/* =========================================================
   記録
========================================================= */

async function saveExpense(
    category,
    subcategory = ""
) {

    const amount =
        Number(
            $("amount").value
        );


    if (
        !Number.isInteger(amount)
        ||
        amount <= 0
    ) {

        showMessage(
            "金額を入力してください"
        );

        $("amount")
            .focus();

        return;

    }


    const date =
        $("date").value;


    if (!date) {

        showMessage(
            "日付を選択してください"
        );

        return;

    }


    const expense = {

        amount:
            amount,

        category:
            category,

        subcategory:
            subcategory,

        memo:
            $("memo")
                .value
                .trim(),

        date:
            date,

        createdAt:
            new Date()
                .toISOString()

    };


    /*
     * まずスマホ内に保存
     *
     * 将来ここに
     * Google同期処理を追加する
     */

    await addExpense(
        expense
    );


    $("amount")
        .value =
        "";


    $("memo")
        .value =
        "";


    $("gamePanel")
        .classList
        .remove(
            "show"
        );


    showMessage(
        "記録しました"
    );


    await refresh();


    $("amount")
        .focus();

}

/* =========================================================
   集計
========================================================= */

async function openStats() {

    const expenses =
        await getAllExpenses();


    const month =
        monthKey(
            new Date()
        );


    const current =
        expenses.filter(
            x =>
                x.date.startsWith(
                    month
                )
        );


    const total =
        current.reduce(
            (sum, x) =>
                sum + x.amount,
            0
        );


    const categoryTotal =
        {};


    current.forEach(
        expense => {

            if (
                !categoryTotal[
                    expense.category
                ]
            ) {

                categoryTotal[
                    expense.category
                ] = 0;

            }


            categoryTotal[
                expense.category
            ] += expense.amount;

        }
    );


    const rows =
        Object.entries(
            categoryTotal
        )
        .sort(
            (a, b) =>
                b[1] - a[1]
        );


    const max =
        rows.length
            ? rows[0][1]
            : 1;


    let html = `

        <div
            class="stat-total">

            <span>
                今月
            </span>

            <strong>
                ${yen(total)}
            </strong>

        </div>

    `;


    rows.forEach(
        ([category, amount]) => {

            const width =
                Math.round(
                    amount /
                    max *
                    100
                );


            html += `

                <div
                    class="stat-row">

                    <span>
                        ${escapeHTML(
                            category
                        )}
                    </span>


                    <div
                        class="bar">

                        <span
                            style="
                                width:${width}%
                            ">
                        </span>

                    </div>


                    <strong>
                        ${yen(amount)}
                    </strong>

                </div>

            `;

        }
    );


    if (
        rows.length === 0
    ) {

        html += `

            <div
                class="empty">

                今月の記録がありません

            </div>

        `;

    }


    $("statsContent")
        .innerHTML =
        html;


    $("statsDialog")
        .showModal();

}


/* =========================================================
   CSV
========================================================= */

async function exportCSV() {

    const expenses =
        await getAllExpenses();


    expenses.sort(
        (a, b) =>
            a.date.localeCompare(
                b.date
            )
    );


    const rows = [

        [
            "日付",
            "金額",
            "大分類",
            "小分類",
            "メモ"
        ],

        ...expenses.map(
            x => [

                x.date,

                x.amount,

                x.category,

                x.subcategory || "",

                x.memo || ""

            ]
        )

    ];


    const csv =
        "\uFEFF"
        +
        rows
            .map(
                row =>
                    row
                        .map(
                            value =>
                                `"${String(
                                    value
                                ).replaceAll(
                                    '"',
                                    '""'
                                )}"`
                        )
                        .join(",")
            )
            .join("\r\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        "散財ログ_"
        +
        monthKey(
            new Date()
        )
        +
        ".csv";


    link.click();


    URL.revokeObjectURL(
        url
    );

}
